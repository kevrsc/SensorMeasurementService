services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sensor-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic sensor-measurements --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic sensor-measurements.dlq --partitions 1 --replication-factor 1

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: sensor-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: sensors
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8081}:8080"

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: sensor-pgadmin
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./data/pgadmin:/var/lib/pgadmin

  ingest:
    build: .
    image: sensor-measurement-service
    container_name: sensor-ingest
    command: ["com.kevrsc.sensor.app.IngestMain"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SENSOR_TOPIC: sensor-measurements
      DB_URL: jdbc:postgresql://timescaledb:5432/sensors
      DB_USER: sensors
      DB_PASSWORD: sensors
      INGEST_PORT: 8080
      INGEST_ADVERTISED_HOST: ${INGEST_ADVERTISED_HOST:-}
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      - "${INGEST_HOST_PORT:-8080}:8080"

  pipeline:
    build: .
    image: sensor-measurement-service
    container_name: sensor-pipeline
    command: ["com.kevrsc.sensor.app.Main"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_GROUP_ID: sensor-measurement-service
      SENSOR_TOPIC: sensor-measurements
      SENSOR_DLQ_TOPIC: sensor-measurements.dlq
      DLQ_FAILURES_FILE: /app/dlq/dead-letter-failures.jsonl
      DB_URL: jdbc:postgresql://timescaledb:5432/sensors
      DB_USER: sensors
      DB_PASSWORD: sensors
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ./data/dlq:/app/dlq

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: sensor-timescaledb
    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: sensors
      POSTGRES_PASSWORD: sensors
    ports:
      - "5432:5432"
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensors -d sensors"]
      interval: 10s
      timeout: 5s
      retries: 10