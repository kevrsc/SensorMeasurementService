plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.kevrsc.sensor.app.Main'
}

group = 'com.kevrsc.sensor'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.18.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.apache.kafka:kafka-clients:3.9.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'org.flywaydb:flyway-core:11.1.0'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:11.1.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.12'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runIngest', JavaExec) {
    group = 'application'
    description = 'Runs the HTTP ingest that publishes ESP32 posts to Kafka.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kevrsc.sensor.app.IngestMain'
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter('5.11.4')
            dependencies {
                implementation project()
                implementation platform('org.testcontainers:testcontainers-bom:1.21.4')
                implementation 'org.testcontainers:postgresql'
                implementation 'org.testcontainers:junit-jupiter'
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn(testing.suites.integrationTest)
}
